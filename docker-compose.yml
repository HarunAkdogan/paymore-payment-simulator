services:
  mongodb:
    image: mongo:7
    container_name: paymore-mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7-alpine
    container_name: paymore-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  mqtt:
    image: eclipse-mosquitto:2
    container_name: paymore-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
volumes:
  mongo_data:
  redis_data:
  mosquitto_data:
